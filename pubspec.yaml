name: getto
description: "Getto — personal home companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  clock: 1.1.3
  drift: 2.35.1
  flutter:
    sdk: flutter
  flutter_svg: 2.3.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  path_provider: 2.1.6
  sqlite3: 3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/figma/m231/
    - assets/figma/m232/
    - assets/figma/m233/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
